version: "3.8"

services:
  # CMS Web Application
  cms-web:
    build:
      context: .
      dockerfile: Dockerfile.optimized
      args:
        APP_NAME: cms-web
        NODE_VERSION: 18
    container_name: shopflow-cms
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3001:3001"
    networks:
      - shopflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # POS Frontend Application
  pos-frontend:
    build:
      context: .
      dockerfile: Dockerfile.optimized
      args:
        APP_NAME: pos-frontend
        NODE_VERSION: 18
    container_name: shopflow-pos
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    networks:
      - shopflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: shopflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - cms-web
      - pos-frontend
    networks:
      - shopflow-network
    restart: unless-stopped

  # Supabase Local (Optional - for local development)
  supabase:
    image: supabase/postgres:latest
    container_name: shopflow-supabase
    environment:
      - POSTGRES_DB=shopflow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shopflow123}
    ports:
      - "5432:5432"
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./migrate:/docker-entrypoint-initdb.d
    networks:
      - shopflow-network
    restart: unless-stopped

networks:
  shopflow-network:
    driver: bridge

volumes:
  supabase_data:
    driver: local
